</style></head><body><div id="app"></div><noscript>This local prototype needs JavaScript enabled.</noscript><script>(function (root) {
  'use strict';
  const VERSION = 1;
  const AREAS = ['School', 'Court', 'Strength', 'Recruiting', 'Life'];
  const GRADES = {A:4,'A-':3.7,'B+':3.3,B:3,'B-':2.7,'C+':2.3,C:2,'C-':1.7,'D+':1.3,D:1,'D-':0.7,F:0};
  function dateKey(date = new Date(), zone = 'America/Denver') {
    const p = new Intl.DateTimeFormat('en-US',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date);
    const get = k => p.find(x=>x.type===k).value;
    return `${get('year')}-${get('month')}-${get('day')}`;
  }
  function addDays(key, days) { const d=new Date(key+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+days); return d.toISOString().slice(0,10); }
  function id() { return globalThis.crypto?.randomUUID?.() || 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2); }
  function initial(today=dateKey()) { return {
    version:VERSION, settings:{name:'Ari',zone:'America/Denver',goal:3,goalType:'unconfirmed',scaleConfirmed:false,grades:{...GRADES}},
    courses:[],assignments:[],study:[],logs:[],events:[],schools:[],reviews:[],
    tasks:[
      {id:'setup-goal',title:'Confirm what the 3.0 goal measures',area:'School',due:today,done:false},
      {id:'setup-classes',title:'Add current classes and grades',area:'School',due:today,done:false},
      {id:'setup-load',title:'Add team practices, games and a rest day',area:'Court',due:today,done:false}
    ],
    academic:{baselineGpa:'',earnedCredits:'',futureCredits:'',futureGpa:'',officialCoreGpa:'',recordDate:''}
  }; }
  function gpa(courses, scale=GRADES) {
    const rows=courses.filter(c=>Number.isFinite(Number(c.credits))&&Number(c.credits)>0&&Object.hasOwn(scale,c.grade));
    const credits=rows.reduce((n,c)=>n+Number(c.credits),0);
    return credits?rows.reduce((n,c)=>n+Number(c.credits)*Number(scale[c.grade]),0)/credits:null;
  }
  function cumulative(base,earned,future,next) {
    if([base,earned,future,next].some(x=>x===''||x===null||x===undefined)) return null;
    const [b,e,f,n]=[base,earned,future,next].map(Number);
    if(![b,e,f,n].every(Number.isFinite)||b<0||b>4||n<0||n>4||e<=0||f<0) return null;
    return (b*e+n*f)/(e+f);
  }
  function requiredGpa(goal,base,earned,future) {
    if([goal,base,earned,future].some(x=>x===''||x===null||x===undefined)) return null;
    const [g,b,e,f]=[goal,base,earned,future].map(Number);
    return [g,b,e,f].every(Number.isFinite)&&g>=0&&g<=4&&b>=0&&b<=4&&e>0&&f>0?(g*(e+f)-b*e)/f:null;
  }
  function percent(m,a) {return Number(a)>0?Math.round(100*Number(m)/Number(a)):null;}
  function aggregate(logs,metric) {
    const rows=logs.filter(x=>x.metric===metric&&x.kind==='court');
    return {makes:rows.reduce((n,x)=>n+x.makes,0),attempts:rows.reduce((n,x)=>n+x.attempts,0),sessions:rows.length};
  }
  function monday(key) {const d=new Date(key+'T12:00:00Z');return addDays(key,-((d.getUTCDay()+6)%7));}
  function weekly(s,key) {
    const start=monday(key),end=addDays(start,6),inside=x=>x>=start&&x<=end;
    return {start,end,study:s.study.filter(x=>inside(x.date)).reduce((a,x)=>a+x.minutes,0),
      training:s.logs.filter(x=>inside(x.date)),tasks:s.tasks.filter(x=>inside(x.due)),
      overdue:s.assignments.filter(x=>!x.done&&x.due<key).length,
      due:s.assignments.filter(x=>!x.done&&inside(x.due)).length,
      rest:s.events.filter(x=>x.type==='Rest'&&inside(x.date)).length};
  }
  function dueItems(s,key) {
    return [...s.tasks.filter(t=>!t.done&&t.due<=key).map(t=>({...t,source:'task'})),
      ...s.assignments.filter(t=>!t.done&&t.due<=key).map(t=>({...t,area:'School',source:'assignment'}))]
      .sort((a,b)=>a.due.localeCompare(b.due)||(a.area==='School'?-1:1));
  }
  function validDate(x) {return typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&!Number.isNaN(Date.parse(x+'T12:00:00Z'))&&new Date(x+'T12:00:00Z').toISOString().slice(0,10)===x;}
  function text(x,max=1000) {return typeof x==='string'&&x.length<=max;}
  function numeric(x,min,max) {return typeof x==='number'&&Number.isFinite(x)&&x>=min&&x<=max;}
  function url(x) {if(!x)return true;try{const u=new URL(x);return u.protocol==='https:'&&!u.username&&!u.password;}catch{return false;}}
  function validate(s) {
    if(!s||s.version!==VERSION||!s.settings||!s.academic) throw Error('This is not a supported Team Ari backup.');
    for(const k of ['courses','assignments','study','logs','events','schools','reviews','tasks'])if(!Array.isArray(s[k])||s[k].length>5000)throw Error('Invalid or oversized '+k+' list.');
    const cfg=s.settings;
    if(!text(cfg.name,80)||!numeric(cfg.goal,0,4)||!['unconfirmed','semester','cumulative'].includes(cfg.goalType)||typeof cfg.scaleConfirmed!=='boolean')throw Error('Invalid settings.');
    try{new Intl.DateTimeFormat('en-US',{timeZone:cfg.zone}).format();}catch{throw Error('Invalid time zone.');}
    if(!cfg.grades||Object.keys(cfg.grades).sort().join()!==Object.keys(GRADES).sort().join()||Object.values(cfg.grades).some(n=>!numeric(n,0,4)))throw Error('Invalid grade scale.');
    const ids=new Set();

  if(trainingTab==='sessions')body=`<div class="two-col"><div>${Object.entries(S).map(([k,v])=>`<article class="training-card"><div class="number">${k==='S'?'STRENGTH':k==='BUSY'?'SHORT SESSION':'SESSION '+k} / ${e(v.time)}</div><h3>${e(v.name)}</h3><p>${e(v.detail)}</p><div class="actions">${action('session','Open session →','btn',`data-session="${k}"`)}${pill(v.tag,'ghost')}</div></article>`).join('')}</div><div><section class="card"><h2>Train with the whole week in view.</h2><div class="note">Place A + B on lighter, preferably nonconsecutive days. Replace extra solo work; fit around practices and games. Keep one day free from organized basketball.</div><p class="small">Use the team lifting plan first. Coach confirms shooting range, technique, current load and injury restrictions. Pain? Stop and tell Coach.</p><div class="divider"></div><h3>Four-week progression</h3><div class="list-row"><p>Week 1</p><small>Establish the baseline.</small></div><div class="list-row"><p>Week 2</p><small>Manageable defense. Retest.</small></div><div class="list-row"><p>Week 3</p><small>Vary closeout and start side.</small></div><div class="list-row"><p>Week 4</p><small>Retest. Review with Coach.</small></div><div class="note">Retests: 20 left-hand finishes, 30 catch-and-shoot attempts, actual free-throw attempts. Keep spots, range and unguarded setup consistent.</div></section></div></div>`;
  if(trainingTab==='progress')body=`<div class="stats">${metricStat('Left-hand finishes','left')}${metricStat('Catch-and-shoot','catch')}${metricStat('Pull-ups','pullup')}${metricStat('Free throws','ft')}</div><div class="two-col"><section class="card"><div class="card-head"><h2>Log the actual work</h2></div><div class="actions">${action('log-court','+ Court result','btn')}${action('log-strength','+ Strength','btn secondary')}${action('log-film','+ Film review','btn light')}${action('checkin','+ Readiness','btn light')}</div><div class="note">Record each test type separately. Use setup notes for range, spots and defense. Only compare sessions under the same conditions; combined percentages summarize volume, not a standardized test.</div>${['left','catch','ft'].map(m=>metricTrend(m)).join('')}</section><section class="card"><div class="card-head"><h2>Recent entries</h2>${pill(state.logs.length+' TOTAL','ghost')}</div>${state.logs.slice().reverse().slice(0,30).map(logRow).join('')||empty('Your baseline starts here.','Nothing has been prefilled with real performance data.')}</section></div>`;
  if(trainingTab==='film')body=`<div class="two-col"><section class="card"><div class="card-head"><h2>Film that teaches you something</h2>${action('log-film','+ Add review','btn secondary tiny')}</div><p class="small">The existing plan calls for 10 minutes of film each week. Pick one good read and one rushed read. Explain what you saw.</p><div class="note">A good read can still end in a miss. In court logs, track good reads against actual possessions, with turnovers in the note.</div>${state.logs.filter(x=>x.kind==='film').slice().reverse().map(logRow).join('')||empty('One win. One adjustment.','Save a film link and timestamped notes. Video uploads are a launch feature.')}</section><section class="card"><h2>Before the next play</h2><div class="note">One comfortable breath. Shoulders loose. See the space. Make the next play.</div><p class="small">Keep the review specific: what was open, what you saw, and what you will do on the next possession.</p></section></div>`;
  return head('Make the reps count.','Your existing four-week plan, ready for the gym.',action('log-court','+ Log result','btn'))+tabs([['sessions','Sessions'],['progress','Progress'],['film','Film + composure']],trainingTab,'training-tab')+body+`<p class="footer-note">Source: Ari_4_Week_Wing_Development_Plan.pdf, current version updated October 14, 2026. Demonstration URLs copied from that plan; internet required. Mirror right-hand demos for left-hand work. Follow the plan’s reps and rules where demonstrations differ.</p>`;
 }
 const METRICS={left:'Left-hand finishes',catch:'Catch-and-shoot',pullup:'Pull-ups',ft:'Free throws',reads:'Good reads',stops:'Defensive stops'};
 function metricStat(label,m){const a=C.aggregate(state.logs,m),p=C.percent(a.makes,a.attempts);return stat(label,p===null?'—':p+'%',a.attempts?`${a.makes} / ${a.attempts} · all logged setups`:'No results logged');}
 function metricTrend(m){const rows=state.logs.filter(x=>x.kind==='court'&&x.metric===m).slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-8);return `<div class="divider"></div><h3>${METRICS[m]}</h3>${rows.length?`<div class="trend" aria-label="${METRICS[m]} recent results">${rows.map(x=>`<div class="column"><span style="height:${Math.max(3,C.percent(x.makes,x.attempts))}%" title="${e(x.date)}: ${x.makes}/${x.attempts}; ${e(x.setup)}"></span></div>`).join('')}</div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Result</th><th>Setup</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${shortDate(x.date)}</td><td>${x.makes}/${x.attempts} · ${C.percent(x.makes,x.attempts)}%</td><td>${e(x.setup||'Not specified')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small" style="margin-top:10px">Log a baseline before measuring change.</p>'}`;}
 function logRow(x){let title='',desc='';if(x.kind==='court'){title=METRICS[x.metric];desc=`${x.makes}/${x.attempts} · ${C.percent(x.makes,x.attempts)}% · ${x.setup||'Setup not specified'}`;}if(x.kind==='strength'){title=x.exercise;desc=`${x.sets} sets × ${x.reps} reps/sec · ${x.load} lb external load`;}if(x.kind==='checkin'){title='Readiness: '+x.readiness;desc=x.sleep+' hours sleep';}if(x.kind==='film'){title=x.title;desc=x.minutes+' minutes reviewed';}return `<div class="list-row"><div class="task-body"><p>${e(title)}</p><small>${shortDate(x.date)} · ${e(desc)}</small>${x.note?`<div class="history-note">${e(x.note)}</div>`:''}${x.kind==='film'&&x.url?`<a href="${e(x.url)}" target="_blank" rel="noopener noreferrer" class="text-btn">Open film ↗</a>`:''}</div>${action('delete-log','×','text-btn danger',`data-id="${e(x.id)}" aria-label="Delete log"`)}</div>`;}
 function sessionPage(){const s=S[session],st=s.steps[stepIndex];return head(s.name,s.detail,action('leave-session','← All sessions','btn light'))+`<div class="session-nav"><span class="eyebrow muted">STEP ${stepIndex+1} / ${s.steps.length}</span><div class="progress-dots">${s.steps.map((_,i)=>`<span class="${i<=stepIndex?'active':''}"></span>`).join('')}</div></div><article class="session-stage"><div class="eyebrow">${st.min?st.min+' MINUTES':'CONTROLLED REPS'} / ${e(s.tag)}</div><h2>${e(st.title)}</h2><p>${e(st.text)}</p><div class="video-links">${st.links.map(l=>`<a href="${e(l.url)}" target="_blank" rel="noopener noreferrer">▶ ${e(l.label)} ↗</a>`).join('')}</div></article><div class="timer"><div><div class="time" id="timer-display">00:00</div><small id="timer-state">${timerRunning?'Running':'Paused'} · stays in this tab</small></div><div class="actions">${action('timer-toggle',timerRunning?'Pause':'Start','btn','id="timer-toggle"')}${action('timer-set','20 sec','btn light tiny','data-seconds="20"')}${action('timer-set','60 sec','btn light tiny','data-seconds="60"')}${st.min?action('timer-set','Full block','btn light tiny',`data-seconds="${st.min*60}"`):action('timer-set','90 sec','btn light tiny','data-seconds="90"')}</div></div><div class="session-nav">${action('step-back','← Back','btn light',stepIndex===0?'disabled':'')}${stepIndex<s.steps.length-1?action('step-next','Next step →','btn'):action(session==='S'?'log-strength':'log-court','Log the work →','btn')}</div><div class="note">Times include rest and rebounds. Stop at the time cap. Videos may show different setups; use the instructions above. Pain? Stop and tell Coach.</div>`;}
 function recruitingPage(){return head('Build the next opportunity.','Family-led recruiting. JUCO is the current direction to evaluate.',action('school','+ Add program','btn'))+`<div class="stats">${stat('Programs tracked',state.schools.length,'No invented college matches')}${stat('Next actions due',state.schools.filter(x=>x.nextDate&&x.nextDate<=viewDate&&x.status!=='Closed').length,'Follow-ups need your action','orange')}${stat('Coach conversations',state.schools.filter(x=>['Coach evaluated','Conversation','Visit'].includes(x.status)).length,'Self-reported substantive contact')}${stat('Film reviews',state.logs.filter(x=>x.kind==='film').length,'Full-game review + highlights')}</div><div class="two-col"><section class="card"><div class="card-head"><h2>Program tracker</h2>${pill('MANUAL OUTREACH','ghost')}</div>${state.schools.length?state.schools.map(s=>`<article class="school-record"><div class="card-head" style="margin-bottom:7px"><h3>${e(s.name)}</h3>${action('school','Edit','text-btn',`data-id="${e(s.id)}"`)}</div><div class="chip-row">${pill(s.level)}${pill(s.status,'ghost')}</div><div class="next"><strong>Next:</strong> ${e(s.nextAction||'Set a specific next action')}${s.nextDate?' · '+shortDate(s.nextDate):''}</div>${s.contact?`<div class="history-note">Contact: ${e(s.contact)}</div>`:''}${s.note?`<div class="history-note">${e(s.note)}</div>`:''}${s.url?`<a class="text-btn" href="${e(s.url)}" target="_blank" rel="noopener noreferrer">Program / film link ↗</a>`:''}</article>`).join(''):empty('Start with a realistic shortlist.','Add verified programs after reviewing basketball fit, academics, support, location and actual family cost.')}</section><div><section class="card"><h2>Recruiting readiness</h2><div class="note">Profile views and automated messages are not the same as a college coach evaluating Ari.</div>${['Verify transcripts, graduation plan and applicable eligibility requirements with the counselor.','Keep a current athletic profile, highlight reel and full-game film.','Ask Coach for a film-based level assessment and introductions where appropriate.','For each program, record academic fit, 2027 roster needs, affordability and the next date.'].map((x,i)=>`<div class="list-row"><div><p>${i+1}. ${e(x)}</p></div></div>`).join('')}</section><section class="card"><h3>Keep the family in control.</h3><p class="small" style="margin-top:10px">This app prepares and tracks. It does not send messages, submit questionnaires, purchase services, or share records.</p></section></div></div>`;}
 function eventRow(x){return `<div class="list-row"><div><p>${e(x.title)}</p><small>${e(x.type)}${x.time?' · '+e(x.time):''}</small></div>${action('delete-event','×','text-btn danger',`data-id="${e(x.id)}" aria-label="Delete event"`)}</div>`;}
 function morePage(){let body='';if(moreTab==='week'){const w=C.weekly(state,viewDate);body=`<div class="two-col"><section class="card"><div class="card-head"><h2>${shortDate(w.start)} – ${shortDate(w.end)}</h2>${action('add-event','+ Schedule','btn secondary tiny')}</div>${Array.from({length:7},(_,i)=>{const d=C.addDays(w.start,i),events=state.events.filter(x=>x.date===d);return `<div class="weekday ${d===viewDate?'today':''}"><h3>${e(fullDate(d))}</h3>${events.map(eventRow).join('')||'<small>Open day. Add school and team commitments before extra work.</small>'}</div>`;}).join('')}</section><div><section class="card"><div class="card-head"><h2>Recovery & commitments</h2>${action('checkin','Check in','text-btn')}</div><div class="note ${w.rest?'':'warn'}">${w.rest?'A rest day is on this week’s schedule.':'No rest day is recorded this week. The existing plan protects one day free from organized basketball.'}</div><p class="small">Add practices, games, school deadlines, family commitments and transport needs. Place extra work around those obligations.</p><div class="divider"></div>${state.logs.filter(x=>x.kind==='checkin').slice(-3).reverse().map(logRow).join('')||empty('Record how you’re arriving.','Sleep and readiness are for planning, not a medical assessment.')}</section><section class="card"><h3>Choose a lighter day.</h3><p class="small" style="margin-top:10px">A + B should fit the team schedule. Coach reviews current workload before adding strength or conditioning. This prototype does not automatically prescribe extra sessions.</p></section></div></div>`;}
  if(moreTab==='review'){const w=C.weekly(state,viewDate);body=`<div class="two-col"><section class="card"><div class="card-head"><h2>Weekly review</h2>${action('review','+ Write review','btn secondary tiny')}</div><div class="review-summary">${e(reviewText())}</div><div class="actions" style="margin-top:18px">${action('copy-review','Copy summary','btn secondary')}</div><div class="note">Family overview preview: the same local data you see elsewhere. Real parent/athlete access and Ari’s agreed sharing settings must be added before launch.</div>${state.reviews.slice().reverse().map(r=>`<div class="list-row"><div><p>${shortDate(r.date)}</p><div class="history-note"><strong>Win:</strong> ${e(r.win)}<br><strong>Adjustment:</strong> ${e(r.adjust)}<br><strong>Support needed:</strong> ${e(r.help)}</div></div>${action('delete-review','×','text-btn danger',`data-id="${e(r.id)}" aria-label="Delete review"`)}</div>`).join('')}</section><section class="card"><h2>A 10-minute conversation.</h2><ol class="spec-list"><li>Which assignment or class needs attention first?</li><li>What did the results show under comparable conditions?</li><li>What did film reveal about a good read and a rushed read?</li><li>What support does Ari need for next week?</li><li>Agree on the week’s priorities and schedule.</li></ol><p class="small">Ari owns his entries. Family supports the work. No hidden monitoring.</p></section></div>`;}
  if(moreTab==='setup')body=setupPage();
  if(moreTab==='build')body=buildPage();
  return head('Keep the whole picture in view.','Plan the week. Review the work. Make the next adjustment.')+tabs([['week','Week plan'],['review','Family review'],['setup','Setup + backup'],['build','Build blueprint']],moreTab,'more-tab')+body;
 }
 function reviewText(){const w=C.weekly(state,viewDate),g=C.gpa(state.courses,state.settings.grades);return `${mode==='demo'?'FICTIONAL DEMO — ':''}TEAM ARI · ${shortDate(w.start)}–${shortDate(w.end)}\nSemester estimate: ${fmt(g,2)}${state.settings.scaleConfirmed?'':' (scale unconfirmed)'}\nGPA goal: ${fmt(state.settings.goal,1)} · ${state.settings.goalType}\nStudy logged: ${w.study} minutes\nOpen overdue assignments: ${w.overdue}\nCourt entries: ${w.training.filter(x=>x.kind==='court').length} (entries, not unique sessions)\nStrength entries: ${w.training.filter(x=>x.kind==='strength').length}\nRest days scheduled: ${w.rest}\nNext conversation: one win, one adjustment, support needed.`;}
 function setupPage(){return `<div class="build-grid"><section class="card"><div class="card-head"><h2>Set it up correctly</h2>${action('settings','Edit','btn secondary tiny')}</div><div class="list-row"><p>GPA goal</p><strong>${fmt(state.settings.goal,1)} · ${e(state.settings.goalType)}</strong></div><div class="list-row"><p>Grade scale</p>${pill(state.settings.scaleConfirmed?'Confirmed':'Needs confirmation',state.settings.scaleConfirmed?'':'orange')}</div><div class="list-row"><p>Time zone</p><small>${e(state.settings.zone)}</small></div><div class="note">No actual grades, transcripts, measurements or results have been preloaded. Demo data is fictional and isolated from the real workspace.</div></section><section class="card"><h2>Save your work</h2><p class="small" style="margin:13px 0 20px">This preview uses browser storage when available. It has no cloud sync or account protection. Export backups and keep them private.</p><div class="actions">${action('export','Export backup','btn')}${action('import','Import backup','btn light')}</div><div class="divider"></div>${action('toggle-demo',mode==='demo'?'Return to real workspace':'Explore fictional demo','btn secondary')}<p class="footer-note">Opening this file in a different browser or on another device does not move your data. The hosted launch needs secure sign-in, member permissions and a database.</p></section><section class="card"><h2>Inputs for the launch</h2><ol class="spec-list"><li>Confirm semester vs cumulative GPA target and deadline.</li><li>Verify current classes, credit units, grading scale and transcript baseline.</li><li>Add the team schedule and Coach’s workload guidance.</li><li>Record the baseline court tests under consistent conditions.</li><li>Agree with Ari on what family and Coach can see.</li><li>Choose the phone access and account approach.</li></ol></section><section class="card"><h2>What’s already here</h2><p class="small" style="margin-top:12px">Daily tasks, classes, assignments, study log, GPA scenarios, the four-week gym cards and video links, court results, strength logging, film notes, readiness, recruiting records, schedule, weekly review, backup and demo mode.</p><div class="note">The prototype works locally. Live integrations, automatic reminders, video uploads and real multi-user permissions are not connected.</div></section></div>`;}
 const PROMPT=`Continue Team Ari from the supplied source package. Preserve the mobile-first interface and current four-week workout plan. Build the hosted version with secure athlete and parent memberships, durable records, backups and explicit sharing controls. Keep semester, cumulative unweighted and NCAA core GPA separate. Use the school-confirmed grading scale and GPA-bearing credit units; never infer eligibility or promise a 3.0 outcome. Preserve actual makes/attempts, test setup and dates. Team practices, games and rest take priority over extra workouts. Add server validation and member authorization on every data route. Migrate a user-imported local backup only after validation and preview. Do not publish, connect school accounts, send messages or upload private records without Leon's authorization. Follow BUILD_SPEC.md and its acceptance gates. Report exactly what is tested and what still needs setup.`;
 function buildPage(){return `<div class="build-grid"><section class="card"><h2>01 / Working prototype</h2><p class="small" style="margin-top:13px">All core areas are represented with functioning local forms and persistence. Start blank or use clearly marked fictional sample data.</p><div class="note">Prepared October 14, 2026 for review. Working title: Team Ari. The name and design are editable.</div></section><section class="card"><h2>02 / Secure hosted launch</h2><ul class="spec-list"><li>Signed-in Ari and approved family members.</li><li>Server-checked membership and record access.</li><li>Durable database, backups, data export and deletion.</li><li>Cross-device sync and a tested phone experience.</li><li>Versioned grading rules and workout plan sources.</li></ul></section><section class="card"><h2>03 / Add after real use</h2><ul class="spec-list"><li>Opt-in reminders tied to actual schedules.</li><li>Coach review access where Ari and family agree.</li><li>Private film uploads with storage limits.</li><li>School integration only if a supported connection exists.</li><li>Longer-term progress based on comparable tests.</li></ul></section><section class="card"><h2>Your walkthrough</h2><ol class="spec-list"><li>Explore Today in fictional demo mode.</li><li>Confirm the GPA target and official inputs.</li><li>Open Session A and log one sample result.</li><li>Review the week and family overview.</li><li>Choose access/sharing and authorize the hosted launch.</li></ol></section></div><section class="card" style="margin-top:20px"><div class="card-head"><h2>Codex handoff prompt</h2>${action('copy-prompt','Copy prompt','btn secondary tiny')}</div><div class="mono">${e(PROMPT)}</div></section><section class="card"><h2>Source & evidence boundary</h2><ul class="spec-list"><li>Leon’s current instructions: 3.0 GPA, stronger left hand, jump shot and an all-encompassing development app.</li><li>Current gym source: Ari_4_Week_Wing_Development_Plan.pdf, version 2, updated October 14, 2026. Drill instructions and demonstration links were carried forward.</li><li>Recruiting source: Ari_NCSA_Call_One_Sheet.pdf, October 11, 2026, read alongside the current family-led JUCO direction. The older NCSA service-purchase discussion is not an app requirement.</li><li>Recovered conversation summaries help identify priorities. They are not substituted for official transcripts, current grades or Coach’s original call recording.</li><li>Training, eligibility and school policy changes require their actual source review before rules are changed.</li></ul></section>`;}
 function field(name,label,value='',type='text',opts={}){return `<div class="field ${opts.full?'full':''}"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${e(value)}" ${opts.required===false?'':'required'} ${opts.min!==undefined?`min="${opts.min}"`:''} ${opts.max!==undefined?`max="${opts.max}"`:''} ${opts.step!==undefined?`step="${opts.step}"`:''} maxlength="${opts.maxlength||160}" ${opts.placeholder?`placeholder="${e(opts.placeholder)}"`:''}></div>`;}
 function select(name,label,items,value,full=false){return `<div class="field ${full?'full':''}"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${items.map(x=>{const v=Array.isArray(x)?x[0]:x,l=Array.isArray(x)?x[1]:x;return `<option value="${e(v)}" ${v===value?'selected':''}>${e(l)}</option>`;}).join('')}</select></div>`;}
 function area(name,label,value='',required=false){return `<div class="field full"><label for="f-${name}">${label}</label><textarea id="f-${name}" name="${name}" maxlength="1000" ${required?'required':''}>${e(value)}</textarea></div>`;}
 function dialog(type,title,fields,recordId=''){const old=document.getElementById('modal');old?.remove();const d=document.createElement('dialog');d.id='modal';d.className='modal';d.innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="close" type="button" data-action="close-modal" aria-label="Close dialog">×</button></div><form id="entry-form" data-type="${type}" data-id="${e(recordId)}"><div class="grid-form">${fields}</div><div class="error-msg" id="form-error" role="alert"></div><div class="form-actions">${recordId?action('delete-'+type,'Delete','btn danger',`data-id="${e(recordId)}"`):''}${action('close-modal','Cancel','btn light')}<button type="submit" class="btn">Save</button></div></form>`;document.body.append(d);d.showModal();}

  if(type==='event')dialog(type,'Add to the schedule',field('title','Commitment / session','','text',{full:true,maxlength:120})+select('type','Type',['Practice','Game','Solo A','Solo B','Strength','Rest','School','Recruiting','Other'],'Practice')+field('date','Date',d,'date')+field('time','Time (optional)','','time',{required:false}));
  if(type==='school'){const x=state.schools.find(x=>x.id===id)||{};dialog(type,id?'Update program':'Add a program',field('name','School / program',x.name||'','text',{full:true,maxlength:140})+select('level','Path',['JUCO','NCAA DIII','NCAA DII','NCAA DI','NAIA','Other'],x.level||'JUCO')+select('status','Status',['Research','Ready to contact','Contacted','Coach evaluated','Conversation','Visit','Application','Closed'],x.status||'Research')+field('contact','Verified contact (optional)',x.contact||'','text',{full:true,required:false})+field('url','Verified program / film link (https)',x.url||'','url',{full:true,required:false})+field('nextAction','Next action',x.nextAction||'','text',{required:false})+field('nextDate','Next action date',x.nextDate||'','date',{required:false})+area('note','Fit, academics, cost, support, roster needs',x.note||''),id);}
  if(type==='review')dialog(type,'Weekly review',field('date','Date',d,'date')+area('win','One win','',true)+area('adjust','One adjustment','',true)+area('help','Support needed','',true));
  if(type==='academic'){const a=state.academic;dialog(type,'GPA baseline & scenario',field('baselineGpa','Verified cumulative unweighted GPA',a.baselineGpa,'number',{required:false,min:0,max:4,step:0.001})+field('earnedCredits','Earned GPA-bearing credit units',a.earnedCredits,'number',{required:false,min:0.01,max:100000,step:0.01})+field('futureCredits','Future GPA-bearing credit units',a.futureCredits,'number',{required:false,min:0.01,max:100000,step:0.01})+field('futureGpa','Scenario GPA on future credits',a.futureGpa,'number',{required:false,min:0,max:4,step:0.001})+field('officialCoreGpa','Official NCAA core GPA (if confirmed)',a.officialCoreGpa,'number',{required:false,min:0,max:4,step:0.001})+field('recordDate','Record date',a.recordDate,'date',{required:false})+'<small class="field full">Use consistent GPA-bearing credit units. Total graduation credits may include classes excluded from GPA. No historical numbers have been assumed.</small>');}
  if(type==='settings'){const cfg=state.settings;dialog(type,'Goal & grading setup',field('name','Name',cfg.name,'text',{maxlength:80})+field('goal','GPA target',cfg.goal,'number',{min:0,max:4,step:0.1})+select('goalType','What does the target measure?',[['unconfirmed','Still needs confirmation'],['semester','Semester GPA'],['cumulative','Cumulative unweighted GPA']],cfg.goalType,true)+select('zone','Schedule time zone',['America/Denver','America/Los_Angeles','America/New_York','America/Chicago'],cfg.zone,true)+'<div class="field full"><h3>Grade points</h3><small>Illustrative unweighted scale. Match the school’s actual policy.</small></div>'+Object.keys(C.GRADES).map(k=>field('grade_'+k,k,cfg.grades[k],'number',{min:0,max:4,step:0.01})).join('')+`<label class="inline-check field full"><input type="checkbox" name="scaleConfirmed" ${cfg.scaleConfirmed?'checked':''}>I verified these grade points and credit treatment against the school’s grading policy.</label>`);}
 }
 function submit(form){const type=form.dataset.type,id=form.dataset.id||C.id(),v=Object.fromEntries(new FormData(form)),num=k=>Number(v[k]);let record;
  if(type==='task')record={id,title:v.title.trim(),area:v.area,due:v.due,done:false};
  if(type==='assignment')record={id,title:(v.course==='General'?'':v.course+': ')+v.title.trim(),due:v.due,done:false};
  if(type==='course')record={id,name:v.name.trim(),grade:v.grade,credits:num('credits')};
  if(type==='study')record={id,subject:v.subject.trim(),minutes:num('minutes'),date:v.date,note:v.note.trim()};
  if(type==='court')record={id,kind:'court',date:v.date,metric:v.metric,makes:num('makes'),attempts:num('attempts'),setup:v.setup.trim(),note:v.note.trim()};
  if(type==='strength')record={id,kind:'strength',date:v.date,exercise:v.exercise.trim(),sets:num('sets'),reps:num('reps'),load:num('load'),note:v.note.trim()};
  if(type==='film')record={id,kind:'film',date:v.date,title:v.title.trim(),url:v.url.trim(),minutes:num('minutes'),note:v.note.trim()};
  if(type==='checkin')record={id,kind:'checkin',date:v.date,sleep:num('sleep'),readiness:v.readiness,note:v.note.trim()};
  if(type==='event')record={id,title:v.title.trim(),type:v.type,date:v.date,time:v.time};
  if(type==='school')record={id,name:v.name.trim(),level:v.level,status:v.status,contact:v.contact.trim(),url:v.url.trim(),nextAction:v.nextAction.trim(),nextDate:v.nextDate,note:v.note.trim()};
  if(type==='review')record={id,date:v.date,win:v.win.trim(),adjust:v.adjust.trim(),help:v.help.trim()};
  const candidate=JSON.parse(JSON.stringify(state));
  if(type==='academic')candidate.academic={...v};
  else if(type==='settings'){const grades={};for(const k of Object.keys(C.GRADES))grades[k]=num('grade_'+k);candidate.settings={name:v.name.trim(),zone:v.zone,goal:num('goal'),goalType:v.goalType,scaleConfirmed:form.elements.scaleConfirmed.checked,grades};}
  else {const bucket={task:'tasks',assignment:'assignments',course:'courses',study:'study',court:'logs',strength:'logs',film:'logs',checkin:'logs',event:'events',school:'schools',review:'reviews'}[type];const i=candidate[bucket].findIndex(x=>x.id===id);if(i>=0)candidate[bucket][i]=record;else candidate[bucket].push(record);}
  try{C.validate(candidate);}catch(err){document.getElementById('form-error').textContent=err.message;return;}
  state=candidate;document.getElementById('modal').close();document.getElementById('modal').remove();persist('Saved'+(mode==='demo'?' to fictional demo.':'.'));
 }
 function demoState(){const d=today(),s=C.initial(d);s.settings={...s.settings,goalType:'semester'};s.tasks=[{id:'demo-t1',title:'Review the algebra practice set',area:'School',due:d,done:false},{id:'demo-t2',title:'Review 10 minutes of game film',area:'Court',due:d,done:false},{id:'demo-t3',title:'Check next week’s ride to practice',area:'Life',due:d,done:true}];s.courses=[{id:'demo-c1',name:'Example Algebra',grade:'B-',credits:1},{id:'demo-c2',name:'Example English',grade:'B',credits:1},{id:'demo-c3',name:'Example Science',grade:'A-',credits:1},{id:'demo-c4',name:'Example History',grade:'B+',credits:1}];s.assignments=[{id:'demo-a1',title:'Example Algebra: practice set',due:C.addDays(d,-1),done:false},{id:'demo-a2',title:'Example English: reading response',due:C.addDays(d,1),done:false}];s.study=[{id:'demo-s1',date:d,subject:'Example Algebra',minutes:25,note:'Reviewed problems 1–8.'}];s.events=[{id:'demo-e1',title:'Example team practice',type:'Practice',date:d,time:'16:00'},{id:'demo-e2',title:'Example rest day',type:'Rest',date:C.addDays(C.monday(d),6),time:''}];s.logs=[{id:'demo-l1',kind:'court',date:C.addDays(d,-7),metric:'left',makes:9,attempts:20,setup:'Short + wing, unguarded',note:'Fictional baseline.'},{id:'demo-l2',kind:'court',date:d,metric:'left',makes:12,attempts:20,setup:'Short + wing, unguarded',note:'Fictional sample.'},{id:'demo-l3',kind:'court',date:d,metric:'catch',makes:16,attempts:30,setup:'3 spots, midrange, unguarded',note:'Fictional sample.'}];s.schools=[{id:'demo-r1',name:'Example College — fictional',level:'JUCO',status:'Research',contact:'',url:'',nextAction:'Review academic fit and full-game film',nextDate:C.addDays(d,2),note:'Example only. Not a recommendation or real recruiting interest.'}];return s;}
 function stopTimer(){clearInterval(timerInterval);timerRunning=false;}
 let deadline=0;
 function updateTimerUI(){const el=document.getElementById('timer-display');if(el)el.textContent=String(Math.floor(timerRemaining/60)).padStart(2,'0')+':'+String(timerRemaining%60).padStart(2,'0');const b=document.getElementById('timer-toggle');if(b)b.textContent=timerRunning?'Pause':'Start';const n=document.getElementById('timer-state');if(n)n.textContent=(timerRunning?'Running':'Paused')+' · stays in this tab';}
 function startTimer(){if(timerRemaining<=0)return;deadline=Date.now()+timerRemaining*1000;timerRunning=true;timerInterval=setInterval(()=>{timerRemaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(!timerRemaining){stopTimer();toast('Time cap reached. Rest or move to the next block.');}updateTimerUI();},250);updateTimerUI();}
 async function copy(text){try{await navigator.clipboard.writeText(text);toast('Copied.');}catch{dialog('copy','Copy this text',area('copy','Select and copy',text));document.querySelector('#entry-form .form-actions').innerHTML=action('close-modal','Close','btn');}}
 function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 async function importData(file){if(file.size>5*1024*1024){toast('Backup is too large. Maximum 5 MB.');return;}try{const s=C.validate(JSON.parse(await file.text()));if(!confirm('Replace this '+(mode==='demo'?'fictional demo':'local workspace')+' with the imported backup? Export your current data first if you need it.'))return;state=s;persist('Backup imported.');}catch(err){toast('Import failed: '+err.message);}}
 document.addEventListener('submit',event=>{if(event.target.id==='entry-form'){event.preventDefault();submit(event.target);}});
 document.addEventListener('change',event=>{if(event.target.id==='view-date'&&C.validDate(event.target.value)){viewDate=event.target.value;render();}});
 document.addEventListener('click',event=>{
  const b=event.target.closest('button');if(!b)return;
  if(b.dataset.page){stopTimer();session=null;page=b.dataset.page;render();window.scrollTo({top:0});return;}
  if(b.dataset.sub){sub=b.dataset.sub;render();return;}
  if(b.dataset.trainingTab){trainingTab=b.dataset.trainingTab;render();return;}
  if(b.dataset.moreTab){moreTab=b.dataset.moreTab;render();return;}
  const a=b.dataset.action,id=b.dataset.id;if(!a)return;
  if(a==='close-modal'){document.getElementById('modal')?.close();document.getElementById('modal')?.remove();return;}
  const forms={'add-task':'task',assignment:'assignment',course:'course',study:'study','log-court':'court','log-strength':'strength','log-film':'film',checkin:'checkin','add-event':'event',school:'school',review:'review',academic:'academic',settings:'settings'};
  if(forms[a]){openForm(forms[a],id);return;}
  if(a==='toggle-task'||a==='toggle-assignment'){const arr=a==='toggle-task'?state.tasks:state.assignments;const t=arr.find(x=>x.id===id);if(t)t.done=!t.done;persist(t?.done?'Completed.':'Reopened.');return;}
  if(a.startsWith('delete-')){const key={task:'tasks',assignment:'assignments',course:'courses',study:'study',log:'logs',event:'events',school:'schools',review:'reviews'}[a.slice(7)];if(!key)return;if(!confirm('Delete this entry from the '+(mode==='demo'?'fictional demo':'local workspace')+'?'))return;state[key]=state[key].filter(x=>x.id!==id);document.getElementById('modal')?.remove();persist('Entry deleted.');return;}
  if(a==='session'){stopTimer();page='training';session=b.dataset.session;stepIndex=0;timerRemaining=(S[session].steps[0].min||1)*60;render();window.scrollTo({top:0});return;}
  if(a==='leave-session'){stopTimer();session=null;render();return;}
  if(a==='step-next'||a==='step-back'){stopTimer();stepIndex+=a==='step-next'?1:-1;stepIndex=Math.max(0,Math.min(S[session].steps.length-1,stepIndex));timerRemaining=(S[session].steps[stepIndex].min||1)*60;render();return;}
  if(a==='timer-toggle'){timerRunning?stopTimer():startTimer();updateTimerUI();return;}
  if(a==='timer-set'){stopTimer();timerRemaining=Number(b.dataset.seconds);updateTimerUI();return;}
  if(a==='toggle-demo'){stopTimer();save();mode=mode==='live'?'demo':'live';if(mode==='demo'){try{const raw=localStorage.getItem(KEYS.demo);state=raw?C.validate(JSON.parse(raw)):demoState();}catch{state=demoState();}}else state=readState(KEYS.live);session=null;viewDate=today();render();return;}
  if(a==='copy-review'){copy(reviewText());return;}
  if(a==='copy-prompt'){copy(PROMPT);return;}
  if(a==='export'){download(JSON.stringify(state,null,2),`Team_Ari_${mode==='demo'?'FICTIONAL_DEMO_':''}Backup_${today()}.json`,'application/json');return;}
  if(a==='import'){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.addEventListener('change',()=>{if(i.files[0])importData(i.files[0]);});i.click();}
 });
 window.addEventListener('beforeunload',()=>{save();stopTimer();});
 render();
})();
</script></body></html>
